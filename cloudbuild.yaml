# Google Cloud Build configuration for automatic deployment to Cloud Run
# This file enables CI/CD: Push to GitHub → Auto-build → Auto-deploy

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sahayak-mentalhealth:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sahayak-mentalhealth:latest'
      - '.'
    timeout: 1800s

  # Step 2: Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sahayak-mentalhealth:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sahayak-mentalhealth:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sahayak-mentalhealth'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sahayak-mentalhealth:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'NODE_ENV=production'

# Build timeout
timeout: 2400s

# Images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/sahayak-mentalhealth:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/sahayak-mentalhealth:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
